    const text=await r.text();
    try{return JSON.parse(text);}catch(e){return{error:"Server error: "+text.slice(0,100)};}

const apiClaude=async(prompt,system,maxTokens=1000)=>{
  try{
    const r=await fetch("/api/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,system,maxTokens})});
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    let t=(d.text||"").trim();
    // Remove common prefixes the AI sometimes adds
    t=t.replace(/^(Here is|Here's|The JSON|JSON:|Result:|Output:)[^\{]*/i,"").trim();
    // Try direct parse
    try{return JSON.parse(t);}catch{}
    // Try stripping markdown code fences
    const cm=t.match(/```(?:json)?\s*([\s\S]*?)```/);
    if(cm){try{return JSON.parse(cm[1].trim());}catch{}}
    // Try extracting the largest JSON object
    const matches=t.match(/\{[\s\S]*\}/g);
    if(matches){
      for(const m of matches.sort((a,b)=>b.length-a.length)){
        try{return JSON.parse(m);}catch{}
      }
    }
    // Try fixing truncated JSON by closing open braces
    try{
      let fixed=t;
      const opens=(fixed.match(/\{/g)||[]).length;
      const closes=(fixed.match(/\}/g)||[]).length;
      if(opens>closes)fixed+="}".repeat(opens-closes);
      // Remove trailing comma before closing brace
      fixed=fixed.replace(/,\s*\}/g,"}").replace(/,\s*\]/g,"]");
      return JSON.parse(fixed);
    }catch{}
    console.warn("Could not parse JSON, raw:",t.slice(0,200));
    throw new Error("Could not parse AI response. Please try again.");
  }catch(e){
    console.error("apiClaude error:",e.message);
    throw e;
  }
};

// HELPERS
function el(tag,attrs,...children){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="class")e.className=v;
    else e.setAttribute(k,v);
  });
  children.flat().forEach(c=>{
    if(c==null||c===false)return;
    e.appendChild(typeof c==="string"?document.createTextNode(c):c);
  });
  return e;
}

function field(label,type,value,onChange,placeholder,hint){
  const wrap=el("div",{style:{marginBottom:"16px"}});
  if(label)wrap.appendChild(el("label",{style:labelStyle},label));
  if(hint)wrap.appendChild(el("p",{style:{fontSize:"12px",color:"#444",margin:"0 0 5px",fontStyle:"italic"}},hint));
  const inp=el("input",{type,placeholder,style:inputStyle});
  inp.value=value||"";
  inp.addEventListener("input",e=>onChange(e.target.value));
  wrap.appendChild(inp);
  return wrap;
}

function textarea(label,value,onChange,placeholder,rows,hint){
  const wrap=el("div",{style:{marginBottom:"16px"}});
  if(label)wrap.appendChild(el("label",{style:labelStyle},label));
  if(hint)wrap.appendChild(el("p",{style:{fontSize:"12px",color:"#444",margin:"0 0 5px",fontStyle:"italic"}},hint));
  const ta=el("textarea",{placeholder,rows:rows||3,style:{...inputStyle,resize:"vertical"}});
  ta.value=value||"";
  ta.addEventListener("input",e=>onChange(e.target.value));
  wrap.appendChild(ta);
  return wrap;
}

function chips(label,hint,options,selected,onToggle,single){
  const wrap=el("div",{style:{marginBottom:"20px"}});
  if(label)wrap.appendChild(el("label",{style:labelStyle},label));
  if(hint)wrap.appendChild(el("p",{style:{fontSize:"12px",color:"#444",margin:"0 0 7px",fontStyle:"italic"}},hint));
  const grid=el("div",{style:{display:"flex",flexWrap:"wrap",gap:"7px",marginTop:"10px"}});
  options.forEach(opt=>{
    const val=typeof opt==="string"?opt:opt.value;
    const lbl=typeof opt==="string"?opt:opt.label;
    const sub=typeof opt==="object"?opt.desc:null;
    const active=single?selected===val:(selected||[]).includes(val);
    const btn=el("button",{style:{background:active?G.aquaDim:G.bg,border:"1px solid "+(active?G.aqua:"rgba(42,184,212,0.18)"),borderRadius:"8px",color:active?G.aqua:"rgba(255,255,255,0.65)",fontSize:"12px",padding:sub?"10px 14px":"7px 12px",cursor:"pointer",fontFamily:"inherit",textAlign:"left"}},
      el("div",{style:{fontWeight:active?"700":"400"}},lbl),
      ...(sub?[el("div",{style:{fontSize:"11px",color:active?"rgba(42,184,212,0.7)":G.muted,marginTop:"2px"}},sub)]:[])
    );
    btn.addEventListener("click",()=>onToggle(val));
    btn.addEventListener("mouseenter",()=>{if(!active)btn.style.borderColor=G.border3;});
    btn.addEventListener("mouseleave",()=>{if(!active)btn.style.borderColor=G.border2||G.border;});
    grid.appendChild(btn);
  });
  wrap.appendChild(grid);
  return wrap;
}

  });
  card.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}},
    el("span",{style:{fontSize:"11px",fontWeight:"700",letterSpacing:"0.1em",color:accentColor,textTransform:"uppercase"}},`${icon} ${title}`),
    copyBtn

  card.appendChild(el("p",{style:{color:"rgba(240,240,248,0.95)",fontSize:"14px",lineHeight:"1.8",margin:"0",whiteSpace:"pre-wrap",fontFamily:"inherit"}},content||""));
  return card;
}

function renderLogin(){
  let email="",password="",loading=false,error="";

  function buildLogin(){
    const g=GL[state.lang]||GL.English;
    const wrap=el("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",background:G.bg,backgroundImage:"radial-gradient(circle at 50% 20%,rgba(42,184,212,0.06) 0%,transparent 50%)"}});
    const inner=el("div",{style:{width:"100%",maxWidth:"420px"}});

    // Language selector at top
    const langRow=el("div",{style:{display:"flex",justifyContent:"center",gap:"8px",marginBottom:"28px"}});
    LANGS.forEach(l=>{
      const btn=el("button",{style:{background:state.lang===l.value?G.aqua:"transparent",color:state.lang===l.value?"#060608":G.muted,border:`1px solid ${state.lang===l.value?G.aqua:G.border}`,borderRadius:"100px",padding:"6px 16px",fontSize:"13px",fontWeight:"600",cursor:"pointer",fontFamily:"inherit"}},l.label);
      btn.addEventListener("click",()=>{state.lang=l.value;document.getElementById("root").innerHTML="";document.getElementById("root").appendChild(buildLogin());});
      langRow.appendChild(btn);
    });
    inner.appendChild(langRow);

    inner.appendChild(el("div",{style:{textAlign:"center",marginBottom:"32px"}},
      el("div",{style:{fontSize:"28px",fontWeight:"700",letterSpacing:"3px",color:G.white,marginBottom:"8px"}},"STREAM",el("span",{style:{color:G.aqua}},"FLUX")),
      el("p",{style:{color:G.muted,fontSize:"14px"}},g.tagline)
    ));

    const card=el("div",{style:cardStyle});
    card.appendChild(el("h2",{style:{fontSize:"18px",fontWeight:"700",marginBottom:"20px",color:G.white}},g.signIn));

    const emailWrap=el("div",{style:{marginBottom:"16px"}});
    emailWrap.appendChild(el("label",{style:labelStyle},g.emailLabel));
    const emailInp=el("input",{type:"email",placeholder:"your@email.com",style:inputStyle});
    emailInp.value=email;
    emailInp.addEventListener("input",e=>email=e.target.value);
    emailWrap.appendChild(emailInp);
    card.appendChild(emailWrap);

    const passWrap=el("div",{style:{marginBottom:"16px"}});
    passWrap.appendChild(el("label",{style:labelStyle},g.passLabel));
    const passInp=el("input",{type:"password",placeholder:"••••••••",style:inputStyle});
    passInp.value=password;
    passInp.addEventListener("input",e=>password=e.target.value);
    passInp.addEventListener("keydown",e=>{if(e.key==="Enter")loginBtn.click();});
    emailInp.addEventListener("keydown",e=>{if(e.key==="Enter")passInp.focus();});
    passWrap.appendChild(passInp);
    card.appendChild(passWrap);

    const errDiv=el("div",{style:{background:"#1a0808",border:"1px solid #3a1010",borderRadius:"8px",padding:"10px 14px",color:"#f87171",fontSize:"13px",marginBottom:"14px",display:error?"block":"none"}},error?`⚠ ${error}`:"");
    card.appendChild(errDiv);

    const loginBtn=el("button",{style:{...btnStyle(loading),width:"100%",fontSize:"15px"}},loading?g.signingIn:g.signInBtn);
    loginBtn.addEventListener("click",async()=>{
      if(!email||!password){error=g.emailLabel+" and "+g.passLabel+" required";document.getElementById("root").innerHTML="";document.getElementById("root").appendChild(buildLogin());return;}
      loading=true;error="";document.getElementById("root").innerHTML="";document.getElementById("root").appendChild(buildLogin());
      const res=await apiAuth({action:"login",email,password});
      loading=false;
      if(res.success){sessionStorage.setItem("sf_user",JSON.stringify(res.user));setState({screen:"dashboard",user:res.user});}
      else{error=res.error||"Login failed.";document.getElementById("root").innerHTML="";document.getElementById("root").appendChild(buildLogin());}
    });
    card.appendChild(loginBtn);
    card.appendChild(el("p",{style:{textAlign:"center",color:G.muted,fontSize:"12px",marginTop:"16px"}},g.noAccount," ",el("span",{style:{color:G.aqua}},"francisco@streamflux.app")));
    inner.appendChild(card);
    wrap.appendChild(inner);
    return wrap;
  }
  return buildLogin();
}

  return wrap;

      row.appendChild(right);

}

        rowTop.appendChild(btns);

function render(){
  // Set document language for spellcheck
  document.documentElement.lang=state.lang==="Spanish"?"es":"en";
  document.documentElement.spellcheck=true;
  const root=document.getElementById("root");
  root.innerHTML="";
  if(state.screen==="login")root.appendChild(renderLogin());
  else if(state.screen==="set-password")root.appendChild(renderSetPassword());
  else if(state.screen==="trial-expired")root.appendChild(renderTrialExpired());
  else if(state.screen==="seat-limit")root.appendChild(renderSeatLimit());
  else if(state.screen==="dashboard"){if(state.user&&state.user.role==="broker"){renderBrokerDashboard().then(brokerEl=>{root.innerHTML="";if(brokerEl)root.appendChild(brokerEl);});}else root.appendChild(renderDashboard());}
  else if(state.screen==="admin")root.appendChild(renderAdmin());
  else if(state.screen==="app1")root.appendChild(renderApp1());
  else if(state.screen==="app2")root.appendChild(renderApp2());
  else if(state.screen==="app3")root.appendChild(renderApp3());
  else if(state.screen==="app1_results"||state.screen==="app2_results")root.appendChild(renderSavedResults(state.screen==="app1_results"?"app1":"app2"));
}

// Clear old history entries that have no result saved (legacy data)
try{
  const oldL=JSON.parse(localStorage.getItem("sf_listings")||"[]");
  const oldC=JSON.parse(localStorage.getItem("sf_clients")||"[]");
  // Keep only entries that were saved with this version (have savedAt)
  // Reset if any entries are the old format without result key defined
  if(oldL.length>0&&!("result" in oldL[0])){localStorage.removeItem("sf_listings");}
  if(oldC.length>0&&!("result" in oldC[0])){localStorage.removeItem("sf_clients");}
}catch(e){}
// CHECK URL TOKEN FOR SET-PASSWORD
const _urlP=new URLSearchParams(window.location.search);
const _token=_urlP.get("token");
const _email=_urlP.get("email");
if(_token){state.screen="set-password";state.resetToken=_token;state.resetEmail=_email||"";render();}
else{
// CHECK SESSION ON LOAD
const saved=sessionStorage.getItem("sf_user");
if(saved){
  const u=JSON.parse(saved);
  apiAuth({action:"check",userId:u.id}).then(res=>{
    if(res.success){state.screen="dashboard";state.user=res.user;render();}
    else{sessionStorage.removeItem("sf_user");render();}
  }).catch(()=>render());
}else{render();}}
